[project]
name = "vamos-agents"
version = "0.2.0"
description = "Every VAmoS voice agent: the vamos_voice framework plus one pack per agent (Remi, debt collection)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The framework's own dependencies only. Agents and vendors add theirs as extras.
dependencies = [
    "fastapi>=0.142,<0.143",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.13,<3",
    "numpy>=2.3,<2.6",
    "websockets>=15,<18",
]

[project.optional-dependencies]
# One extra per agent pack under vamos_agents/ (named like the folder) and one per vendor under
# vamos_voice/providers/. An image installs exactly one of each: --extra $AGENT --extra $VENDOR.

# --- agents ---
remi = [
    "psycopg[binary]>=3.3,<3.4",
    "httpx>=0.28,<0.29",  # the Fineract ledger client (ledger.py)
]

# --- vendors (the speech-to-speech vendors need nothing beyond the core: raw websockets) ---
openai_realtime = []
gemini_live = []
grok_voice = []
gpt_live = []
pipecat = [
    "pipecat-ai[deepgram,cartesia,openai,silero,websocket]>=1.12,<1.13",
    "openai>=3.0,<4",
]
# Managed voice agents: the vendor runs STT, LLM and TTS; tools are client-side over the socket.
deepgram = []
elevenlabs = [
    "httpx>=0.28,<0.29",  # the per-call stored agent (create/delete)
]
fluxions = [
    "httpx>=0.28,<0.29",  # GET /config (the soul cap) and /voices at warm-up
]
# In-pod cascades (vamos_voice/providers/cascade.py): Silero VAD for barge-in runs on onnxruntime.
mistral = [
    "mistralai[realtime]>=2.10,<3",
    "onnxruntime>=1.24,<1.31",
]
huggingface = [
    "openai>=3.0,<4",
    "httpx>=0.28,<0.29",
    "onnxruntime>=1.24,<1.31",
]
grok_cascade = [
    "openai>=3.0,<4",
    "onnxruntime>=1.24,<1.31",
]
gradium = [
    "gradbot>=0.2,<0.3",
]
# Hosted orchestrators: the vendor runs STT -> LLM -> TTS; the pod relays audio and answers tools.
vapi = [
    "httpx>=0.28,<0.29",
]
cartesia = [
    "httpx>=0.28,<0.29",
]
# LiveKit Agents in-process, in a room on the image's own livekit-server (see the Dockerfile).
livekit = [
    "aiohttp>=3.10,<4",
    "livekit>=1.1,<1.2",
    "livekit-api>=1.2,<1.3",
    "livekit-agents>=1.8,<1.9",
    "livekit-plugins-openai>=1.8,<1.9",
    "livekit-plugins-deepgram>=1.8,<1.9",
    "livekit-plugins-elevenlabs>=1.8,<1.9",
    "livekit-plugins-silero>=1.8,<1.9",
]
# The silent baseline (a null agent for benchmark sanity checks, not a candidate): no dependencies.
silent = []

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vamos_voice", "vamos_agents"]


[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "T20", "SIM", "RUF"]
# Long prose strings (tool descriptions, prompts) are left to the formatter.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "vamos_agents"]
markers = [
    "postgres: needs a real Postgres (docker or REMI_TEST_DATABASE_URL); Remi's tests",
]

[tool.uv]
# An image installs one vendor extra, so vendor extras may pin incompatible versions of a shared
# library. LiveKit Agents needs openai<3; the extras that use the openai SDK pin openai>=3 (pipecat,
# huggingface, grok_cascade). Each is locked in its own fork against livekit.
conflicts = [
    [{ extra = "pipecat" }, { extra = "livekit" }],
    [{ extra = "huggingface" }, { extra = "livekit" }],
    [{ extra = "grok-cascade" }, { extra = "livekit" }],
]
